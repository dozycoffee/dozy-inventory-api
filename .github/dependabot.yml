version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Kotlin과 Spring Boot는 WMS와 버전을 맞추기 위해 수동으로 올린다 (ADR-0001)
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "org.springframework.boot*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
