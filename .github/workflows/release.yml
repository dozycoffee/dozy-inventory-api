name: Release

# 컨테이너 이미지 릴리스 (dozy-auth 서버 릴리스와 같은 방식).
# main의 커밋에 v{major}.{minor}.{patch} 태그를 push하면 실행된다.
# 다시 빌드하지 않는다. CI가 그 커밋에서 빌드·테스트해 올린 sha-{7자리} 이미지에 X.Y.Z 태그만 덧붙이고 GitHub Release를 만든다.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # GitHub Release 생성
  packages: write # ghcr 이미지에 태그 추가
  actions: read # 태그 커밋의 CI 실행 상태 조회

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dozycoffee/dozy-inventory-api

# 기본 셸(bash -e)은 pipefail이 꺼져 있어 `inspect | jq`에서 inspect가 실패해도 성공으로 본다. shell: bash는 -eo pipefail로 실행한다
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    # CI(최대 20분)가 끝나기를 기다릴 수 있게 넉넉히 둔다
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main 포함 여부 검사와 릴리스 노트에 전체 기록이 필요

      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "source=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 리뷰와 CI를 거친 코드만 릴리스한다. 다른 브랜치의 커밋에 붙인 태그는 실패시킨다
      - name: 태그 커밋이 main에 있는지 확인
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 태그의 커밋($GITHUB_SHA)이 main에 없습니다. main의 커밋에 태그를 붙이세요."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그를 main 병합 직후에 붙이면 그 커밋의 CI가 아직 돌고 있을 수 있다. CI가 끝날 때까지 기다리고,
      # 실행 중인 CI가 없는데 이미지도 없으면(실패, 또는 뒤이은 병합에 밀려 그 커밋의 CI가 건너뛰어짐) 바로 실패한다
      - name: sha- 이미지 기다리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ env.IMAGE }}:${{ steps.version.outputs.source }}
        run: |
          for attempt in $(seq 1 70); do
            if docker buildx imagetools inspect "$SOURCE" > /dev/null 2>&1; then
              echo "$SOURCE 이미지가 있습니다."
              exit 0
            fi
            running="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [[ "$running" == "0" ]]; then
              echo "::error::$SOURCE 이미지가 없고 이 커밋($GITHUB_SHA)에서 실행 중인 main CI도 없습니다. CI가 실패했거나 뒤이은 병합에 밀려 이 커밋을 건너뛰었을 수 있습니다. Actions에서 CI 결과를 확인하고, 이미지가 있는 main 커밋에 태그를 다시 붙이세요."
              exit 1
            fi
            echo "이 커밋의 CI가 실행 중입니다. 30초 뒤 다시 확인합니다 ($attempt/70)."
            sleep 30
          done
          echo "::error::기다리는 시간 안에 $SOURCE 이미지가 올라오지 않았습니다. CI가 끝난 뒤 이 워크플로를 다시 실행하세요."
          exit 1

      # sha- 태그가 정말 이 커밋에서 만든 multi-arch 이미지인지 라벨로 확인한다
      - name: 이미지 확인
        env:
          SOURCE: ${{ env.IMAGE }}:${{ steps.version.outputs.source }}
        run: |
          image="$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Image}}')"
          for platform in linux/amd64 linux/arm64; do
            revision="$(jq -r --arg p "$platform" '.[$p].config.Labels["org.opencontainers.image.revision"] // empty' <<< "$image")"
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "::error::$SOURCE 의 $platform 이미지 revision($revision)이 태그 커밋($GITHUB_SHA)과 다릅니다."
              exit 1
            fi
          done

      # 같은 버전은 다른 이미지로 다시 붙이지 않는다. 같은 이미지에 이미 붙어 있으면(재실행) 그대로 둔다
      - name: X.Y.Z 태그 추가
        env:
          SOURCE: ${{ env.IMAGE }}:${{ steps.version.outputs.source }}
          TARGET: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          source_digest="$(digest "$SOURCE")"
          if target_digest="$(digest "$TARGET" 2> /dev/null)" && [[ -n "$target_digest" ]]; then
            if [[ "$target_digest" != "$source_digest" ]]; then
              echo "::error::$TARGET 태그가 이미 다른 이미지($target_digest)에 있습니다. 같은 버전은 다시 쓰지 않고 다음 patch 버전으로 릴리스하세요."
              exit 1
            fi
            echo "$TARGET 태그가 이미 같은 이미지에 있습니다."
          else
            docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          fi
          target_digest="$(digest "$TARGET")"
          if [[ "$target_digest" != "$source_digest" ]]; then
            echo "::error::$TARGET($target_digest)이 $SOURCE($source_digest)와 다른 이미지입니다."
            exit 1
          fi
          echo "$TARGET = $SOURCE ($source_digest)"

      # 노트는 직전 v* 태그 이후 main에 병합된 PR을 모은다 (.github/scripts/release-notes.sh)
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ steps.version.outputs.source }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME 릴리스가 이미 있습니다."
            exit 0
          fi
          {
            echo "이미지: \`$IMAGE:$VERSION\` (\`$SOURCE_TAG\`와 같은 이미지, 커밋 $GITHUB_SHA)"
            echo
            .github/scripts/release-notes.sh "$GITHUB_REF_NAME"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
