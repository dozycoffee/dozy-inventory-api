name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 같은 PR의 이전 실행은 취소하고, main 푸시는 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ./scripts/verify.sh
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload OpenAPI spec
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: build/api-spec/openapi3.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          retention-days: 7

  # 컨테이너 이미지가 빌드되고 실제로 기동하는지 확인한다(ADR-0035). 이미지는 어디에도 올리지 않는다
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # dozy-auth 스타터를 받는 자격은 BuildKit secret으로만 넘겨 이미지에 남기지 않는다
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: dozy-inventory-api:ci
          secrets: |
            gpr_user=${{ github.actor }}
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: ./scripts/image-smoke-test.sh dozy-inventory-api:ci
