name: dozy-inventory

# 로컬 개발용 MySQL. 실행 전 .env.example을 .env로 복사하고 DB_PASSWORD를 채운다.
services:
  mysql:
    image: mysql:8.0
    container_name: dozy-inventory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다 (.env.example을 .env로 복사해 값을 채우세요)}
      MYSQL_DATABASE: ${DB_NAME:-dozy_inventory}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 로컬 개발용 Kafka(KRaft 단일 노드). Outbox 이벤트가 이 브로커로 발행된다
  kafka:
    image: apache/kafka:3.8.0
    container_name: dozy-inventory-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT는 호스트(./gradlew bootRun)용, INTERNAL은 compose 네트워크 안의 컨테이너(app)용이다
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # 컨테이너 이미지 실행 확인용. 평소 개발에는 쓰지 않는다: docker compose --profile app up --build
  # 이미지 빌드에 GPR_USER, GPR_TOKEN(read:packages)이 환경변수로 필요하다. 이미지에는 남지 않는다.
  app:
    profiles: [ "app" ]
    image: dozy-inventory-api:local
    build:
      context: .
      secrets:
        - gpr_user
        - gpr_token
    container_name: dozy-inventory-app
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dozy_inventory}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_ISSUER_BASE_URI: ${AUTH_ISSUER_BASE_URI:-http://localhost:8081}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${SERVER_PORT:-8082}:8082"
    healthcheck:
      # 이미지에 curl이 없어 bash의 /dev/tcp로 readiness를 확인한다(CMD-SHELL은 /bin/sh라 /dev/tcp가 없다)
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '" ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

secrets:
  gpr_user:
    environment: GPR_USER
  gpr_token:
    environment: GPR_TOKEN

volumes:
  mysql-data:
