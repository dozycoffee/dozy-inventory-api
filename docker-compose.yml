name: dozy-inventory

# 로컬 개발용 MySQL. 실행 전 .env.example을 .env로 복사하고 DB_PASSWORD를 채운다.
services:
  mysql:
    image: mysql:8.0
    container_name: dozy-inventory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다 (.env.example을 .env로 복사해 값을 채우세요)}
      MYSQL_DATABASE: ${DB_NAME:-dozy_inventory}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
