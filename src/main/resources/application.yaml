spring:
  application:
    name: dozy-inventory-api

  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dozy_inventory}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dozy_inventory}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

dozy:
  auth:
    audience: inventory
    accepted-realms: [internal]
    issuer-base-uri: ${AUTH_ISSUER_BASE_URI:http://localhost:8081}

inventory:
  # 유통기한이 오늘부터 이 일수 이내이면 Lot을 임박 상태로 본다
  expiring-soon-days: 30
  reservation:
    # 예약 만료 시각의 상한(생성 시각 + TTL). 채널 값이 확정되기 전이라 기본값만 두고,
    # 채널별로 다르게 하려면 channels에 채널명: 시간을 추가한다(예: STORE: 48h)
    max-ttl:
      default: 1h
      channels: {}

server:
  port: ${SERVER_PORT:8082}
