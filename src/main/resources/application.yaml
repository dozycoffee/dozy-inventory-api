spring:
  application:
    name: dozy-inventory-api

  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dozy_inventory}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dozy_inventory}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 응답하지 않으면 발행기가 오래 막히지 않고 실패로 처리해 다음 주기에 다시 시도한다
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

dozy:
  auth:
    audience: inventory
    accepted-realms: [internal]
    issuer-base-uri: ${AUTH_ISSUER_BASE_URI:http://localhost:8081}

inventory:
  # 유통기한이 오늘부터 이 일수 이내이면 Lot을 임박 상태로 본다
  expiring-soon-days: 30
  adjustment:
    # 실사 조정에서 항목 하나의 변동량 절댓값이 이 값을 넘으면 승인자가 필요하다. 기본값 100은 가정한 값이라 운영 전에 정한다.
    # 카테고리별로 다르게 하려면 categories에 카테고리명: 수량을 추가한다(예: BEAN: 20)
    approval-threshold:
      default: 100
      categories: {}
  reservation:
    # 예약 만료 시각의 상한(생성 시각 + TTL). 채널 값이 확정되기 전이라 기본값만 두고,
    # 채널별로 다르게 하려면 channels에 채널명: 시간을 추가한다(예: STORE: 48h)
    max-ttl:
      default: 1h
      channels: {}
    # 만료 시각이 지난 확정 전 예약을 만료 처리하는 스케줄러. 테스트에서는 끈다
    expiry-scan:
      enabled: true
      interval: PT1M
      batch-size: 100
  outbox:
    # Outbox 대기 이벤트를 Kafka로 발행하는 스케줄러. 테스트에서는 끈다. 토픽은 {topic-prefix}.{집계 유형 소문자}이다
    publisher:
      enabled: true
      interval: PT1S
      batch-size: 100
      topic-prefix: dozy.inventory
    # 발행이 끝난 이벤트를 보관 기간(retention) 뒤 삭제하는 스케줄러. 발행 대기 이벤트는 지우지 않는다. 테스트에서는 끈다
    cleanup:
      enabled: true
      interval: PT1H
      initial-delay: PT1M
      retention: P7D
      batch-size: 1000

server:
  port: ${SERVER_PORT:8082}
