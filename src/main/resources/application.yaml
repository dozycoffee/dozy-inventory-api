spring:
  application:
    name: dozy-inventory-api

  lifecycle:
    # 종료 신호를 받은 뒤 진행 중인 요청을 기다리는 최대 시간
    timeout-per-shutdown-phase: 30s

  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dozy_inventory}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dozy_inventory}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 응답하지 않으면 발행기가 오래 막히지 않고 실패로 처리해 다음 주기에 다시 시도한다
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: dozy-inventory-api
      # 새 그룹이 처음 붙으면 보관 중인 소속 이벤트를 처음부터 읽어 사본을 채운다
      auto-offset-reset: earliest

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

dozy:
  auth:
    audience: inventory
    accepted-realms: [internal]
    # 헬스 체크는 배포 플랫폼의 probe와 로드밸런서가 토큰 없이 호출한다. 다른 actuator 엔드포인트는 노출하지 않는다
    public-paths:
      - /actuator/health
      - /actuator/health/**
    # 다른 서비스(WMS)를 system client로 호출할 때 쓴다. 켜면 AUTH_CLIENT_ID·AUTH_CLIENT_SECRET이 필요하다(비밀은 환경변수로만 주입한다)
    client:
      enabled: ${AUTH_CLIENT_ENABLED:false}
      client-id: ${AUTH_CLIENT_ID:}
      client-secret: ${AUTH_CLIENT_SECRET:}
    issuer-base-uri: ${AUTH_ISSUER_BASE_URI:http://localhost:8081}

inventory:
  # 어드민 콘솔처럼 브라우저에서 직접 호출하는 origin. 쉼표로 구분하고 와일드카드는 쓰지 않는다
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 하루 1회 WMS 수량과 대사해 보정안을 만드는 배치(ADR-0033). 테스트에서는 끈다. WMS 주소는 환경변수 WMS_BASE_URL로 주입한다
  reconciliation:
    enabled: true
    cron: "0 30 1 * * *"
    zone: Asia/Seoul
    wms:
      base-url: ${WMS_BASE_URL:}
      timeout: PT10S
  # WMS의 직원 창고 소속 변경 이벤트를 받아 warehouse_access 사본을 교체하는 리스너(ADR-0032). 테스트에서는 끈다
  warehouse-access:
    listener:
      enabled: true
      topic: dozy.wms.warehouse-access
  # 유통기한이 오늘부터 이 일수 이내이면 Lot을 임박 상태로 본다
  expiring-soon-days: 30
  adjustment:
    # 실사 조정에서 항목 하나의 변동량 절댓값이 이 값을 넘으면 승인자가 필요하다. 기본값 100은 가정한 값이라 운영 전에 정한다.
    # 카테고리별로 다르게 하려면 categories에 카테고리명: 수량을 추가한다(예: BEAN: 20)
    approval-threshold:
      default: 100
      categories: {}
  reservation:
    # 예약 만료 시각의 상한(생성 시각 + TTL). 채널 값이 확정되기 전이라 기본값만 두고,
    # 채널별로 다르게 하려면 channels에 채널명: 시간을 추가한다(예: STORE: 48h)
    max-ttl:
      default: 1h
      channels: {}
    # 만료 시각이 지난 확정 전 예약을 만료 처리하는 스케줄러. 테스트에서는 끈다
    expiry-scan:
      enabled: true
      interval: PT1M
      batch-size: 100
  # 유통기한이 지난 Lot의 상태를 갱신하고 재고를 폐기 예정으로 옮기는 스케줄러(ADR-0027). 하루 한 번(cron, zone 기준)이며 테스트에서는 끈다
  lot-expiration-scan:
    enabled: true
    cron: "0 10 0 * * *"
    zone: Asia/Seoul
    batch-size: 100
  outbox:
    # Outbox 대기 이벤트를 Kafka로 발행하는 스케줄러. 테스트에서는 끈다. 토픽은 {topic-prefix}.{집계 유형 소문자}이다
    publisher:
      enabled: true
      interval: PT1S
      batch-size: 100
      # 이벤트 고유의 발행 실패가 이 횟수에 이르면 격리(DEAD)한다. 브로커 장애처럼 공통 문제로 인한 실패는 세지 않는다(ADR-0037)
      max-attempts: 20
      topic-prefix: dozy.inventory
    # 발행이 끝난 이벤트를 보관 기간(retention) 뒤 삭제하는 스케줄러. 발행 대기 이벤트는 지우지 않는다. 테스트에서는 끈다
    cleanup:
      enabled: true
      interval: PT1H
      initial-delay: PT1M
      retention: P7D
      batch-size: 1000

server:
  port: ${SERVER_PORT:8082}
  # SIGTERM을 받으면 새 요청을 거절하고(readiness 실패) 진행 중인 요청이 끝나길 기다린 뒤 종료한다
  shutdown: graceful

# 헬스 체크만 노출한다(메트릭 등은 관측성 작업에서 정한다). 상세 정보는 숨겨 상태(UP/DOWN)만 응답한다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # liveness는 프로세스가 살아 있는지만 본다. 외부 의존성이 죽었다고 재시작하면 장애가 커진다
        liveness:
          include: livenessState
        # readiness는 요청을 받을 수 있는지다. DB가 없으면 조회·예약을 처리할 수 없다.
        # Kafka는 넣지 않는다. 브로커가 죽어도 Outbox에 쌓아 두었다가 복구되면 발행하므로 요청 처리에는 영향이 없다
        readiness:
          include: readinessState,r2dbc
